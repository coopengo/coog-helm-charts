# -- Configure secret with docker image registry credentials.
imageCredentials:
  # -- secret to be used to download image for all components.
  name: docker-registry
  # -- Registry URL
  registry: docker.io
  # -- Registry account username
  username: ""
  # -- Registry account password
  password: ""
  # -- Registry account email
  email: ""


# -- PostgreSQL dependency parameters.
# Pour Coreye, communiquer le nouveau fonctionnement pour l'injection des values postgresql
postgresql:
  auth:
    # -- Admin User for the "postgres" admin user (Mandatory if isManaged is false and admin user account is not "postgres")
    # This is a coog parameter not postgresql
    # This parameter is needed to init database on first deployment
    # default: "postgres"
    adminUsername: ""
    # -- Password for the admin user (If empty, auto-generated for postgresql.isManaged = true - TODO)
    # default: ""
    postgresPassword: ""
    # -- Name for a custom user to create (if isManaged is true) and/or use to connect database
    # default: ""
    username: "coog"
    # -- Password for the custom user to create (if isManaged is true) and/or use to connect database
    # default: ""
    password: "changeme"
    # -- Name for a custom database to create (if isManaged is true) and/or use
    # default : .Release.Name
    database: ""

# -- RabbitMq sensitive parameters.
# In rabbitmq.mode=operator, `password` is read by the Topology Operator ONLY at
# initial User CR bootstrap (when status.credentials.name is empty). After that,
# changing this value and running `helm upgrade` is silently a no-op for the
# broker — the operator does not re-import the secret. To rotate, see
# `scripts/rotate-rabbitmq-user.sh` and the README section "Rotation du password
# user (mode operator)".
# Refs: https://www.rabbitmq.com/kubernetes/operator/using-topology-operator
#       https://github.com/rabbitmq/messaging-topology-operator/issues/571
rabbitmq:
  auth:
    username: coog
    password: "changeme"

# -- Mongodb sensitive parameters.
mongodb:
  auth:
    enabled: true
    databases:
      - api-core-services
    rootPassword: admin
    usernames:
      - coog
    passwords:
      - admin

secrets:
  # -- Shared JWT key. SINGLE SOURCE OF TRUTH: this one value feeds the three environment
  # variables that must always be identical, otherwise a token issued by one component is
  # rejected by the others:
  #   - JWT_INTERNAL_ENCRYPTION         -> frontCore components
  #   - JWT_ENCRYPTION                  -> gateway
  #   - TRYTOND_SESSION__JWT_ENCRYPTION -> backCore (coog, celery, cron)
  # Mandatory as soon as frontCore.enabled is true: the render fails if left empty.
  # Careful: enabling only apiB2c, apiReferential, b2c, b2b, customerBackend or
  # customerFrontend also deploys the gateway, but does NOT make this value mandatory --
  # set it anyway on those setups, or the JWT keys will be missing.
  # Generate one with: openssl rand -base64 32
  jwt_encryption: ""

  # -- Global secrets
  extraEnvVar: {}
    # back
    # -- # Loaded in coog-api-b2c too
    # COOG_DOCUMENT_TOKEN_SECRET: "" # auto-generated if not define

  # -- backCore
  # We can configure secrets shared with backCore components in this block.
  backCore:
    extraEnvVar:
      # -- Mandatory
      # TRYTOND_SESSION__PASSPHRASE: "" # auto-generated if not define
      # TRYTOND_SESSION__JWT_ENCRYPTION must NOT be set here: use secrets.jwt_encryption
      # instead. Setting it here now fails the render.
      TRYTOND_EMAIL__URI: "changeme"

    migrator:
      extraEnvVar:
        # Override the default values from postresql.auth
        TRYTOND_MIGRATION__PASSWORD: ""
        TRYTOND_MIGRATION__USER: ""

    coog:
      # -- Custom secret applied only to coog component
      extraEnvVar: {}

    celery:
      # -- Custom secret applied only to celery component
      extraEnvVar: {}

    cron:
      # -- Custom secret applied only to cron component
      extraEnvVar: {}

  # -- FrontCore
  # If one frontend component is enabled: true, it will enable by default the frontCore components (gateway, api & apiIdentityManager)
  # We can configure secrets shared with frontCore components in this block.
  frontCore:
    # JWT_INTERNAL_ENCRYPTION must NOT be set here: use secrets.jwt_encryption instead.
    # Setting it here now fails the render.
    extraEnvVar: {}

    gateway:
      # -- config environment variables are applied to frontCore (gateway, api & apiIdentityManager)
      # JWT_ENCRYPTION must NOT be set here: use secrets.jwt_encryption instead.
      # Setting it here now fails the render.
      extraEnvVar: {}
        # COOG_WEB_TOKEN: "" # auto-generated if not define

    api:
      extraEnvVar: {}

    apiIdentityManager:
      extraEnvVar: {}

  apiReferential:
    extraEnvVar: {}

  apiB2c:
    extraEnvVar: {}

  customerBackend:
    extraEnvVar: {}

  customerFrontend:
    extraEnvVar:
      GATSBY_GEOAPIFY_API_KEY: "changeme"