# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Test frontcore secret
templates:
  - secret-frontcore.yaml
release:
  name: test # Do not edit
  namespace: test
capabilities:
  majorVersion: 1
  minorVersion: 29
tests:
  - it: Test metadata & template
    set:
      frontCore:
        enabled: true
      secrets:
        jwt_encryption: test-jwt-encryption-key
        frontCore:
          extraEnvVar:
            ENABLE_FRONTCORE_SECRET: foo
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: test-coog-frontcore-configuration
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: coog
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: test
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
      - matchRegex:
          path: metadata.labels["app.kubernetes.io/version"]
          pattern: coog-.*$
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep

  - it: Test variables (1/3)
    set:
      frontCore:
        enabled: true
      secrets:
        jwt_encryption: test-jwt-encryption-key
        frontCore:
          extraEnvVar:
            ENABLE_FRONTCORE_SECRET: foo
    asserts:
      - equal:
          path: stringData.ENABLE_FRONTCORE_SECRET
          value: foo
      - equal:
          path: stringData.JWT_INTERNAL_ENCRYPTION
          value: test-jwt-encryption-key
      - equal:
          path: stringData.POSTGRESQL_URL
          value: postgresql://:@test-postgresql:5432/test

  - it: Test variables (2/3)
    set:
      frontCore:
        enabled: true
      postgresql:
        auth:
          username: 'user'
          password: 'pass'
      secrets:
        jwt_encryption: test-jwt-encryption-key
        frontCore:
          extraEnvVar:
            ENABLE_FRONTCORE_SECRET: foo
    asserts:
      - equal:
          path: stringData.ENABLE_FRONTCORE_SECRET
          value: foo
      - equal:
          path: stringData.JWT_INTERNAL_ENCRYPTION
          value: test-jwt-encryption-key
      - equal:
          path: stringData.POSTGRESQL_URL
          value: postgresql://user:pass@test-postgresql:5432/test

  - it: Test variables (3/3)
    set:
      frontCore:
        enabled: true
      postgresql:
        auth:
          username: 'user'
          password: 'pass'
          api_user: 'api_user'
          api_password: 'api_password'
      secrets:
        jwt_encryption: test-jwt-encryption-key
        frontCore:
          extraEnvVar:
            ENABLE_FRONTCORE_SECRET: foo
    asserts:
      - equal:
          path: stringData.ENABLE_FRONTCORE_SECRET
          value: foo
      - equal:
          path: stringData.JWT_INTERNAL_ENCRYPTION
          value: test-jwt-encryption-key
      - equal:
          path: stringData.POSTGRESQL_URL
          value: postgresql://api_user:api_password@test-postgresql:5432/test

  - it: Test frontCore enabled secret
    set:
      frontCore:
        enabled: true
      secrets:
        jwt_encryption: test-jwt-encryption-key
        frontCore:
          extraEnvVar:
            ENABLE_FRONTCORE_SECRET: foo
    asserts:
      - hasDocuments:
          count: 1

  - it: Test apiB2c enabled secret
    set:
      apiB2c:
        enabled: true
      secrets:
        jwt_encryption: test-jwt-encryption-key
        frontCore:
          extraEnvVar:
            ENABLE_FRONTCORE_SECRET: foo
    asserts:
      - hasDocuments:
          count: 1

  - it: Test apiReferential enabled secret
    set:
      apiReferential:
        enabled: true
      secrets:
        jwt_encryption: test-jwt-encryption-key
        frontCore:
          extraEnvVar:
            ENABLE_FRONTCORE_SECRET: foo
    asserts:
      - hasDocuments:
          count: 1

  - it: Test b2c enabled secret
    set:
      b2c:
        enabled: true
      secrets:
        jwt_encryption: test-jwt-encryption-key
        frontCore:
          extraEnvVar:
            ENABLE_FRONTCORE_SECRET: foo
    asserts:
      - hasDocuments:
          count: 1

  - it: Test b2b enabled secret
    set:
      b2b:
        enabled: true
      secrets:
        jwt_encryption: test-jwt-encryption-key
        frontCore:
          extraEnvVar:
            ENABLE_FRONTCORE_SECRET: foo
    asserts:
      - hasDocuments:
          count: 1

  - it: Test customerBackend enabled secret
    set:
      customerBackend:
        enabled: true
      secrets:
        jwt_encryption: test-jwt-encryption-key
        frontCore:
          extraEnvVar:
            ENABLE_FRONTCORE_SECRET: foo
    asserts:
      - hasDocuments:
          count: 1

  - it: Test customerFrontend enabled secret
    set:
      customerFrontend:
        enabled: true
      secrets:
        jwt_encryption: test-jwt-encryption-key
        frontCore:
          extraEnvVar:
            ENABLE_FRONTCORE_SECRET: foo
    asserts:
      - hasDocuments:
          count: 1

  - it: Test not enabled secret (1/2)
    asserts:
      - hasDocuments:
          count: 0

  - it: Test not enabled secret (2/2)
    set:
      frontCore:
        enabled: false
      apiB2c:
        enabled: false
      apiReferential:
        enabled: false
      b2c:
        enabled: false
      b2b:
        enabled: false
      customerBackend:
        enabled: false
      customerFrontend:
        enabled: false
      secrets:
        jwt_encryption: test-jwt-encryption-key
        frontCore:
          extraEnvVar:
            ENABLE_FRONTCORE_SECRET: foo
    asserts:
      - hasDocuments:
          count: 0

  # [Start] secrets.jwt_encryption — single source of truth for the shared JWT key
  - it: Test jwt_encryption feeds JWT_INTERNAL_ENCRYPTION
    set:
      frontCore:
        enabled: true
      secrets:
        jwt_encryption: test-jwt-encryption-key
    asserts:
      - equal:
          path: stringData.JWT_INTERNAL_ENCRYPTION
          value: test-jwt-encryption-key

  - it: Test jwt_encryption is mandatory when frontCore is enabled
    set:
      frontCore:
        enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "secrets.jwt_encryption is mandatory when frontCore.enabled is true: it is the JWT key shared by the gateway, the frontCore components and the back office. Generate one with `openssl rand -base64 32`."

  # frontCore.enabled stays false here, so the key is not enforced: the secret renders
  # without JWT_INTERNAL_ENCRYPTION rather than with an auto-generated one.
  - it: Test JWT_INTERNAL_ENCRYPTION is absent without jwt_encryption
    set:
      customerBackend:
        enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - notExists:
          path: stringData.JWT_INTERNAL_ENCRYPTION

  - it: Test legacy frontCore JWT_INTERNAL_ENCRYPTION is rejected
    set:
      frontCore:
        enabled: true
      secrets:
        jwt_encryption: test-jwt-encryption-key
        frontCore:
          extraEnvVar:
            JWT_INTERNAL_ENCRYPTION: legacy-key
    asserts:
      - failedTemplate:
          errorMessage: "secrets.frontCore.extraEnvVar.JWT_INTERNAL_ENCRYPTION is no longer supported. Move its value to secrets.jwt_encryption, which now feeds JWT_INTERNAL_ENCRYPTION, JWT_ENCRYPTION and TRYTOND_SESSION__JWT_ENCRYPTION at once."

  - it: Test legacy gateway JWT_ENCRYPTION is rejected
    set:
      frontCore:
        enabled: true
      secrets:
        jwt_encryption: test-jwt-encryption-key
        frontCore:
          gateway:
            extraEnvVar:
              JWT_ENCRYPTION: legacy-key
    asserts:
      - failedTemplate:
          errorMessage: "secrets.frontCore.gateway.extraEnvVar.JWT_ENCRYPTION is no longer supported. Move its value to secrets.jwt_encryption, which now feeds JWT_INTERNAL_ENCRYPTION, JWT_ENCRYPTION and TRYTOND_SESSION__JWT_ENCRYPTION at once."

  - it: Test legacy backCore TRYTOND_SESSION__JWT_ENCRYPTION is rejected
    set:
      frontCore:
        enabled: true
      secrets:
        jwt_encryption: test-jwt-encryption-key
        backCore:
          extraEnvVar:
            TRYTOND_SESSION__JWT_ENCRYPTION: legacy-key
    asserts:
      - failedTemplate:
          errorMessage: "secrets.backCore.extraEnvVar.TRYTOND_SESSION__JWT_ENCRYPTION is no longer supported. Move its value to secrets.jwt_encryption, which now feeds JWT_INTERNAL_ENCRYPTION, JWT_ENCRYPTION and TRYTOND_SESSION__JWT_ENCRYPTION at once."
  # [End] secrets.jwt_encryption
