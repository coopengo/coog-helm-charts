# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Test coog configmap
templates:
  - coog/configmap.yaml
release:
  name: test # Do not edit
  namespace: test
capabilities:
  majorVersion: 1
  minorVersion: 29
tests:
  - it: Test metadata & template
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: test-coog-configuration
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: coog
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: test
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
      - matchRegex:
          path: metadata.labels["app.kubernetes.io/version"]
          pattern: coog-.*$

  - it: Test variables (1/2)
    set:
      host: test.local
      backCore:
        coog:
          workers:
            number: 2
          extraEnvVar:
            ENABLE_COOG_DYNAMIC_CONFIG: foo
          ingress:
            hosts:
              - host: test0.local
      customerBackend:
        enabled: true
    asserts:
      - equal:
          path: data.COOG_SERVER_WORKERS
          value: "2"
      - equal:
          path: data.TRYTOND_WEB__CORS
          value: |-
            https://coog.local
            https://test0.local
            http://test-coog
      - equal:
          path: data.TRYTOND_STRAPI__URL
          value: http://test-coog-customer-backend
      - equal:
          path: data.ENABLE_COOG_DYNAMIC_CONFIG
          value: foo

  - it: Test variables (2/2)
    set:
      host: test.local
      backCore:
        workers:
          number: 5
    asserts:
      - equal:
          path: data.COOG_SERVER_WORKERS
          value: "5"

  - it: Test TRYTOND_WEB__CORS with istio and whitelists
    set:
      istio:
        enabled: true
      backCore:
        coog:
          ingress:
            hosts:
              - host: test0.local
            nginx:
              whiteList:
                cors:
                  - https://cors0.local
          istio:
            hosts:
              - host: test1.local
            whiteList:
              cors:
                - https://cors1.local
    asserts:
      - equal:
          path: data.TRYTOND_WEB__CORS
          value: |-
            https://coog.local
            https://test0.local
            https://test1.local
            http://test-coog
            https://cors0.local
            https://cors1.local

  # [Start] Tryton bus (backCore.bus)
  - it: Test bus variables absent by default
    asserts:
      - notExists:
          path: data.TRYTOND_BUS__ALLOW_SUBSCRIBE
      - notExists:
          path: data.TRYTOND_BUS__URL_HOST

  - it: Test bus announced at login, through the gateway (istio main host)
    set:
      istio:
        enabled: true
        mainHost: acme.example.com
      backCore:
        bus:
          enabled: true
    asserts:
      - equal:
          path: data.TRYTOND_BUS__ALLOW_SUBSCRIBE
          value: "1"
      - equal:
          path: data.TRYTOND_BUS__URL_HOST
          value: https://acme.example.com/gateway/coog/

  - it: Test bus URL host without istio, custom gateway base path
    set:
      ingress:
        host: acme.example.com
      frontCore:
        gateway:
          extraEnvVar:
            COOG_GATEWAY_BASE_PATH: /portal-gateway/
      backCore:
        bus:
          enabled: true
    asserts:
      - equal:
          path: data.TRYTOND_BUS__URL_HOST
          value: https://acme.example.com/portal-gateway/coog/
  # [End] Tryton bus
