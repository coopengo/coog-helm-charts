# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/apischema/helm-testsuite.json
suite: Test gateway secret
templates:
  - gateway/secret.yaml
release:
  name: test # Do not edit
  namespace: test
capabilities:
  majorVersion: 1
  minorVersion: 29
tests:
  - it: Test metadata & template
    set:
      frontCore:
        enabled: true
      secrets:
        jwt_encryption: test-jwt-encryption-key
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: test-coog-gateway-configuration
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: coog-gateway
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: test
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
      - matchRegex:
          path: metadata.labels["app.kubernetes.io/version"]
          pattern: coog-.*$
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep

  - it: Test variables (1/2)
    set:
      frontCore:
        enabled: true
      secrets:
        jwt_encryption: test-jwt-encryption-key
        frontCore:
          gateway:
            extraEnvVar:
              ENABLE_GATEWAY_SECRET: foo
    asserts:
      - equal:
          path: stringData.ENABLE_GATEWAY_SECRET
          value: "foo"
      - matchRegex:
          path: stringData.COOG_WEB_TOKEN
          pattern: ^[a-zA-Z0-9]{32}$

  - it: Test variables (2/3)
    set:
      frontCore:
        enabled: true
      secrets:
        jwt_encryption: test-jwt-encryption-key
        frontCore:
          gateway:
            extraEnvVar:
              COOG_WEB_TOKEN: foo
    asserts:
      - equal:
          path: stringData.COOG_WEB_TOKEN
          value: foo
      - equal:
          path: stringData.JWT_ENCRYPTION
          value: test-jwt-encryption-key

  - it: Test variables 3/3)
    set:
      frontCore:
        enabled: true
      secrets:
        jwt_encryption: some_secret
    asserts:
      - equal:
          path: stringData.JWT_ENCRYPTION
          value: some_secret

  - it: Test gateway enabled secret (1/7)
    set:
      frontCore:
        enabled: true
      secrets:
        jwt_encryption: test-jwt-encryption-key
    asserts:
      - hasDocuments:
          count: 1

  - it: Test gateway enabled secret (2/7)
    set:
      apiB2c:
        enabled: true
    asserts:
      - hasDocuments:
          count: 1

  - it: Test gateway enabled secret (3/7)
    set:
      apiReferential:
        enabled: true
    asserts:
      - hasDocuments:
          count: 1

  - it: Test gateway enabled secret (4/7)
    set:
      b2c:
        enabled: true
    asserts:
      - hasDocuments:
          count: 1

  - it: Test gateway enabled secret (5/7)
    set:
      b2b:
        enabled: true
    asserts:
      - hasDocuments:
          count: 1

  - it: Test gateway enabled secret (6/7)
    set:
      customerBackend:
        enabled: true
    asserts:
      - hasDocuments:
          count: 1

  - it: Test gateway enabled secret (7/7)
    set:
      customerFrontend:
        enabled: true
    asserts:
      - hasDocuments:
          count: 1

  - it: Test not enabled secret (1/2)
    asserts:
      - hasDocuments:
          count: 0

  - it: Test not enabled secret (2/2)
    set:
      frontCore:
        enabled: false
      apiB2c:
        enabled: false
      apiReferential:
        enabled: false
      b2c:
        enabled: false
      b2b:
        enabled: false
      customerBackend:
        enabled: false
      customerFrontend:
        enabled: false
      secrets:
        frontCore:
          gateway:
            extraEnvVar: {}
    asserts:
      - hasDocuments:
          count: 0

  # [Start] secrets.jwt_encryption — single source of truth for the shared JWT key
  - it: Test jwt_encryption feeds JWT_ENCRYPTION
    set:
      frontCore:
        enabled: true
      secrets:
        jwt_encryption: test-jwt-encryption-key
    asserts:
      - equal:
          path: stringData.JWT_ENCRYPTION
          value: test-jwt-encryption-key

  # frontCore.enabled stays false here, so the key is not enforced: the gateway secret
  # renders without JWT_ENCRYPTION rather than with an auto-generated one.
  - it: Test JWT_ENCRYPTION is absent without jwt_encryption
    set:
      customerBackend:
        enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - notExists:
          path: stringData.JWT_ENCRYPTION
  # [End] secrets.jwt_encryption
