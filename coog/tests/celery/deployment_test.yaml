# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Test celery deployment
templates:
  - celery/configmap.yaml
  - celery/deployment.yaml
  - celery/secret.yaml
  - configmap-global.yaml
  - configmap-backcore.yaml
  - secret-global.yaml
  - secret-backcore.yaml
  - secret-postgresql.yaml
release:
  name: test # Do not edit
  namespace: test
capabilities:
  majorVersion: 1
  minorVersion: 29
tests:
  - it: Test metadata & template
    template: celery/deployment.yaml
    set:
      extraEnvVar:
        ENABLE_GLOBAL_CONFIGMAP: foo
      secrets:
        extraEnvVar:
          ENABLE_GLOBAL_SECRET: foo
        backCore:
          celery:
            extraEnvVar:
              ENABLE_CELERY_SECRET: foo
      imageCredentials:
        name: test-registry
    asserts:
      - isKind:
          of: Deployment
      - contains:
          path: spec.template.spec.imagePullSecrets
          content:
            name: test-registry
      - equal:
          path: metadata.name
          value: test-coog-celery
      - isNotNull:
          path: spec.replicas
      - matchRegex:
          path: spec.strategy.type
          pattern: ^(RollingUpdate|Recreate)$
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: coog-celery
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: test
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
      - matchRegex:
          path: metadata.labels["app.kubernetes.io/version"]
          pattern: coog-.*$
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: coog-celery
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/instance"]
          value: test
      # [Start] Check checksum configuration - auto update pods when there is a change in configmap & secrets
      - isNotEmpty:
          path: spec.template.metadata.annotations["checksum/configmap-global"]
      - isNotEmpty:
          path: spec.template.metadata.annotations["checksum/configmap-backcore"]
      - isNotEmpty:
          path: spec.template.metadata.annotations["checksum/configmap"]
      - isNotEmpty:
          path: spec.template.metadata.annotations["checksum/secret-global"]
      - isNotEmpty:
          path: spec.template.metadata.annotations["checksum/secret-backcore"]
      - isNotEmpty:
          path: spec.template.metadata.annotations["checksum/secret"]
      - isNotEmpty:
          path: spec.template.metadata.annotations["checksum/secret-postgresql"]
      # [End] Check checksum configuration - auto update pods when there is a change in configmap & secrets
      # [Start] Basic check at Template Pod level security stadards (enforced)
      - equal:
          path: spec.template.spec.securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.securityContext.privileged
          value: false
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - isNotEmpty:
          path: spec.template.spec.securityContext.seccompProfile
      # [End] Basic check at Pod level security stadards

  - it: Test disabled configmaps, secrets & checksums
    template: celery/deployment.yaml
    set:
      extraEnvVar: {}
      secrets:
        extraEnvVar: {}
        backCore:
          celery:
            extraEnvVar: {}
    asserts:
      - notExists:
          path: spec.template.metadata.annotations["checksum/configmap-global"]
      - isNotEmpty:
          path: spec.template.metadata.annotations["checksum/configmap-backcore"]
      - isNotEmpty:
          path: spec.template.metadata.annotations["checksum/configmap"]
      - notExists:
          path: spec.template.metadata.annotations["checksum/secret-global"]
      - isNotEmpty:
          path: spec.template.metadata.annotations["checksum/secret-backcore"]
      - notExists:
          path: spec.template.metadata.annotations["checksum/secret"]
      - isNotEmpty:
          path: spec.template.metadata.annotations["checksum/secret-postgresql"]
      # [Start] Check environment files for celery
      - notContains:
          path: spec.template.spec.containers[?(@.name == "coog-celery")].envFrom
          content:
            configMapRef:
              name: test-coog-global-configuration
      - contains:
          path: spec.template.spec.containers[?(@.name == "coog-celery")].envFrom
          content:
            configMapRef:
              name: test-coog-backcore-configuration
      - contains:
          path: spec.template.spec.containers[?(@.name == "coog-celery")].envFrom
          content:
            configMapRef:
              name: test-coog-celery-configuration
      - notContains:
          path: spec.template.spec.containers[?(@.name == "coog-celery")].envFrom
          content:
            secretRef:
              name: test-coog-global-configuration
      - contains:
          path: spec.template.spec.containers[?(@.name == "coog-celery")].envFrom
          content:
            secretRef:
              name: test-coog-backcore-configuration
      - notContains:
          path: spec.template.spec.containers[?(@.name == "coog-celery")].envFrom
          content:
            secretRef:
              name: test-coog-celery-configuration
      - contains:
          path: spec.template.spec.containers[?(@.name == "coog-celery")].envFrom
          content:
            secretRef:
              name: test-coog-postgresql
      # [End] Check environment files for celery
      # [Start] Check environment files for celery database maintenance
      - notContains:
          path: spec.template.spec.containers[?(@.name == "coog-celery-database-maintenance")].envFrom
          content:
            configMapRef:
              name: test-coog-global-configuration
      - contains:
          path: spec.template.spec.containers[?(@.name == "coog-celery-database-maintenance")].envFrom
          content:
            configMapRef:
              name: test-coog-backcore-configuration
      - contains:
          path: spec.template.spec.containers[?(@.name == "coog-celery-database-maintenance")].envFrom
          content:
            configMapRef:
              name: test-coog-celery-configuration
      - notContains:
          path: spec.template.spec.containers[?(@.name == "coog-celery-database-maintenance")].envFrom
          content:
            secretRef:
              name: test-coog-global-configuration
      - contains:
          path: spec.template.spec.containers[?(@.name == "coog-celery-database-maintenance")].envFrom
          content:
            secretRef:
              name: test-coog-backcore-configuration
      - notContains:
          path: spec.template.spec.containers[?(@.name == "coog-celery-database-maintenance")].envFrom
          content:
            secretRef:
              name: test-coog-celery-configuration
      - contains:
          path: spec.template.spec.containers[?(@.name == "coog-celery-database-maintenance")].envFrom
          content:
            secretRef:
              name: test-coog-postgresql
      # [End] Check environment files

  - it: Test Container
    template: celery/deployment.yaml
    set:
      extraEnvVar:
        ENABLE_GLOBAL_CONFIGMAP: foo
      backCore:
        celery:
          worker:
            resources:
              limits:
                cpu: 200m
                memory: 500Mi
              requests:
                cpu: 100m
                memory: 250Mi
          databaseMaintenance:
            resources:
              limits:
                cpu: 200m
                memory: 500Mi
              requests:
                cpu: 100m
                memory: 250Mi
      secrets:
        extraEnvVar:
          ENABLE_GLOBAL_SECRET: foo
        backCore:
          celery:
            extraEnvVar:
              ENABLE_CELERY_SECRET: foo
    asserts:
      # Check Containers pod image (celery)
      - equal:
          path: spec.template.spec.containers[?(@.name == "coog-celery")].image
          value: cooghub/coog:changeme
      - matchRegex:
          path: spec.template.spec.containers[?(@.name == "coog-celery")].imagePullPolicy
          pattern: ^(Always|Never|IfNotPresent)$
      # Check Containers pod image (celery-database-maintenance)
      - equal:
          path: spec.template.spec.containers[?(@.name == "coog-celery-database-maintenance")].image
          value: cooghub/coog:changeme
      - matchRegex:
          path: spec.template.spec.containers[?(@.name == "coog-celery-database-maintenance")].imagePullPolicy
          pattern: ^(Always|Never|IfNotPresent)$
      # [Start] Check environment files celery
      - contains:
          path: spec.template.spec.containers[?(@.name == "coog-celery")].envFrom
          content:
            configMapRef:
              name: test-coog-global-configuration
      - contains:
          path: spec.template.spec.containers[?(@.name == "coog-celery")].envFrom
          content:
            configMapRef:
              name: test-coog-backcore-configuration
      - contains:
          path: spec.template.spec.containers[?(@.name == "coog-celery")].envFrom
          content:
            configMapRef:
              name: test-coog-celery-configuration
      - contains:
          path: spec.template.spec.containers[?(@.name == "coog-celery")].envFrom
          content:
            secretRef:
              name: test-coog-global-configuration
      - contains:
          path: spec.template.spec.containers[?(@.name == "coog-celery")].envFrom
          content:
            secretRef:
              name: test-coog-backcore-configuration
      - contains:
          path: spec.template.spec.containers[?(@.name == "coog-celery")].envFrom
          content:
            secretRef:
              name: test-coog-celery-configuration
      - contains:
          path: spec.template.spec.containers[?(@.name == "coog-celery")].envFrom
          content:
            secretRef:
              name: test-coog-postgresql
      # [End] Check environment files celery
      # [Start] Check environment files celery-database-maintenance
      - contains:
          path: spec.template.spec.containers[?(@.name == "coog-celery-database-maintenance")].envFrom
          content:
            configMapRef:
              name: test-coog-global-configuration
      - contains:
          path: spec.template.spec.containers[?(@.name == "coog-celery-database-maintenance")].envFrom
          content:
            configMapRef:
              name: test-coog-backcore-configuration
      - contains:
          path: spec.template.spec.containers[?(@.name == "coog-celery-database-maintenance")].envFrom
          content:
            configMapRef:
              name: test-coog-celery-configuration
      - contains:
          path: spec.template.spec.containers[?(@.name == "coog-celery-database-maintenance")].envFrom
          content:
            secretRef:
              name: test-coog-global-configuration
      - contains:
          path: spec.template.spec.containers[?(@.name == "coog-celery-database-maintenance")].envFrom
          content:
            secretRef:
              name: test-coog-backcore-configuration
      - contains:
          path: spec.template.spec.containers[?(@.name == "coog-celery-database-maintenance")].envFrom
          content:
            secretRef:
              name: test-coog-celery-configuration
      - contains:
          path: spec.template.spec.containers[?(@.name == "coog-celery-database-maintenance")].envFrom
          content:
            secretRef:
              name: test-coog-postgresql
      # [End] Check environment files celery-database-maintenance
      - contains:
          path: spec.template.spec.containers[?(@.name == "coog-celery")].ports
          content:
            name: http
            containerPort: 8000
      - contains:
          path: spec.template.spec.containers[?(@.name == "coog-celery-database-maintenance")].ports
          content:
            name: http
            containerPort: 8000
      # [Start] Check resources limites & requests
      # Pod-level resources: max of the worker and database-maintenance resources
      - equal:
          path: spec.template.spec.resources
          value:
            limits:
              cpu: 200m
              memory: 500Mi
            requests:
              cpu: 100m
              memory: 250Mi
      - notExists:
          path: spec.template.spec.containers[?(@.name == "coog-celery")].resources
      - notExists:
          path: spec.template.spec.containers[?(@.name == "coog-celery-database-maintenance")].resources
      # [End] Check resources limites & requests
      # [Start] Basic check at container level security stadards (enforced)
      - equal:
          path: spec.template.spec.containers[?(@.name == "coog-celery")].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[?(@.name == "coog-celery")].securityContext.privileged
          value: false
      - equal:
          path: spec.template.spec.containers[?(@.name == "coog-celery")].securityContext.runAsNonRoot
          value: true
      - isNotEmpty:
          path: spec.template.spec.containers[?(@.name == "coog-celery")].securityContext.seccompProfile
      - equal:
          path: spec.template.spec.containers[?(@.name == "coog-celery-database-maintenance")].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[?(@.name == "coog-celery-database-maintenance")].securityContext.privileged
          value: false
      - equal:
          path: spec.template.spec.containers[?(@.name == "coog-celery-database-maintenance")].securityContext.runAsNonRoot
          value: true
      - isNotEmpty:
          path: spec.template.spec.containers[?(@.name == "coog-celery-database-maintenance")].securityContext.seccompProfile
      # [End] Basic check at Pod level security stadards

  - it: Test Volumes
    template: celery/deployment.yaml
    set:
      backCore:
        persistentVolume:
          enabled: true
          existingClaim: test-workspace-io
    asserts:
      - equal:
          path: spec.template.spec.volumes[?(@.name == "test-workspace-io")].persistentVolumeClaim.claimName
          value: test-workspace-io
      - contains:
          path: spec.template.spec.containers[?(@.name == "coog-celery")].volumeMounts
          content:
            name: test-workspace-io
            mountPath: /workspace/io
            readOnly: false
      - contains:
          path: spec.template.spec.containers[?(@.name == "coog-celery-database-maintenance")].volumeMounts
          content:
            name: test-workspace-io
            mountPath: /workspace/io
            readOnly: false

  - it: Test Global components configuration
    template: celery/deployment.yaml
    set:
      replicaCount: 2
      strategy:
        type: Recreate
      image:
        repository: global-docker-repository
        tag: global-docker-tag
        pullPolicy: Always
      securityContext:
        runAsUser: 1003
        runAsGroup: 1003
      # Remove default values in backCore to test global value
      backCore:
        securityContext:
          runAsUser: ""
          runAsGroup: ""
    asserts:
      - equal:
          path: spec.replicas
          value: 2
      - equal:
          path: spec.strategy.type
          value: Recreate
      - equal:
          path: spec.template.spec.containers[?(@.name == "coog-celery")].image
          value: global-docker-repository/coog:global-docker-tag
      - equal:
          path: spec.template.spec.containers[?(@.name == "coog-celery")].imagePullPolicy
          value: Always
      - equal:
          path: spec.template.spec.containers[?(@.name == "coog-celery")].securityContext.runAsUser
          value: 1003
      - equal:
          path: spec.template.spec.containers[?(@.name == "coog-celery")].securityContext.runAsGroup
          value: 1003
      - equal:
          path: spec.template.spec.containers[?(@.name == "coog-celery-database-maintenance")].image
          value: global-docker-repository/coog:global-docker-tag
      - equal:
          path: spec.template.spec.containers[?(@.name == "coog-celery-database-maintenance")].imagePullPolicy
          value: Always
      - equal:
          path: spec.template.spec.containers[?(@.name == "coog-celery-database-maintenance")].securityContext.runAsUser
          value: 1003
      - equal:
          path: spec.template.spec.containers[?(@.name == "coog-celery-database-maintenance")].securityContext.runAsGroup
          value: 1003

  - it: Test serviceAccountName is not set when serviceAccount.name is empty
    template: celery/deployment.yaml
    set:
      serviceAccount:
        name: ""
    asserts:
      - notExists:
          path: spec.template.spec.serviceAccountName

  - it: Test serviceAccountName is set when serviceAccount.name is defined
    template: celery/deployment.yaml
    set:
      serviceAccount:
        name: my-custom-sa
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: my-custom-sa

  - it: Test specific component configuration
    template: celery/deployment.yaml
    set:
      backCore:
        strategy:
          type: RollingUpdate
        image:
          repository: specific-docker-repository
          tag: specific-docker-tag
          pullPolicy: Never
        securityContext:
          runAsUser: 1001
          runAsGroup: 1001
        celery:
          replicaCount: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3
      - equal:
          path: spec.strategy.type
          value: RollingUpdate
      - equal:
          path: spec.template.spec.containers[?(@.name == "coog-celery")].image
          value: specific-docker-repository/coog:specific-docker-tag
      - equal:
          path: spec.template.spec.containers[?(@.name == "coog-celery")].imagePullPolicy
          value: Never
      - equal:
          path: spec.template.spec.containers[?(@.name == "coog-celery")].securityContext.runAsUser
          value: 1001
      - equal:
          path: spec.template.spec.containers[?(@.name == "coog-celery")].securityContext.runAsGroup
          value: 1001
      - equal:
          path: spec.template.spec.containers[?(@.name == "coog-celery-database-maintenance")].image
          value: specific-docker-repository/coog:specific-docker-tag
      - equal:
          path: spec.template.spec.containers[?(@.name == "coog-celery-database-maintenance")].imagePullPolicy
          value: Never
      - equal:
          path: spec.template.spec.containers[?(@.name == "coog-celery-database-maintenance")].securityContext.runAsUser
          value: 1001
      - equal:
          path: spec.template.spec.containers[?(@.name == "coog-celery-database-maintenance")].securityContext.runAsGroup
          value: 1001

  - it: Test health probes
    template: celery/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name == "coog-celery")].livenessProbe.exec.command
          value:
            - ep
            - liveness_celery
            - --app-name
            - coog-celery
      - equal:
          path: spec.template.spec.containers[?(@.name == "coog-celery")].readinessProbe.exec.command
          value:
            - ep
            - readiness_sub_service
      - equal:
          path: spec.template.spec.containers[?(@.name == "coog-celery-database-maintenance")].livenessProbe.exec.command
          value:
            - ep
            - liveness_celery
            - --app-name
            - coog-celery-database-maintenance
      - equal:
          path: spec.template.spec.containers[?(@.name == "coog-celery-database-maintenance")].readinessProbe.exec.command
          value:
            - ep
            - readiness_sub_service

  - it: Test pod-level resources when database maintenance only overrides memory
    template: celery/deployment.yaml
    set:
      backCore:
        celery:
          worker:
            resources:
              limits:
                cpu: 1000m
                memory: 2500Mi
              requests:
                cpu: 500m
                memory: 1250Mi
          databaseMaintenance:
            resources:
              limits:
                memory: 1000Mi
              requests:
                memory: 500Mi
    asserts:
      # max per resource: the worker's, above database maintenance (memory override,
      # cpu from the chart defaults 300m / 150m)
      - equal:
          path: spec.template.spec.resources
          value:
            limits:
              cpu: 1000m
              memory: 2500Mi
            requests:
              cpu: 500m
              memory: 1250Mi

  - it: Test pod-level resources without limits on one container
    template: celery/deployment.yaml
    set:
      backCore:
        celery:
          databaseMaintenance:
            resources: null
    asserts:
      # the pod was not bounded: no pod limits, requests of the worker only
      - equal:
          path: spec.template.spec.resources
          value:
            requests:
              cpu: 150m
              memory: 350Mi

  - it: Test pod-level resources are at least the istio sidecar's
    template: celery/deployment.yaml
    set:
      istio:
        enabled: true
      backCore:
        celery:
          worker:
            resources:
              limits:
                cpu: 200m
                memory: 70Mi
              requests:
                cpu: 25m
                memory: 35Mi
          databaseMaintenance:
            resources:
              limits:
                cpu: 50m
                memory: 70Mi
              requests:
                cpu: 25m
                memory: 35Mi
    asserts:
      # max per resource with the sidecar (100m/256Mi, 50m/128Mi): cpu limit from the worker
      - equal:
          path: spec.template.spec.resources
          value:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi

  - it: Test pod-level resources reject resources other than cpu and memory
    template: celery/deployment.yaml
    set:
      backCore:
        celery:
          worker:
            resources:
              limits:
                ephemeral-storage: 1Gi
    asserts:
      - failedTemplate:
          errorMessage: "resources.limits.ephemeral-storage: pod-level resources only accept cpu and memory"

  - it: Test container-level resources when podLevelResources is false
    template: celery/deployment.yaml
    set:
      podLevelResources: false
      istio:
        enabled: true
    asserts:
      # 24.41 keeps its pod-level line, backCore.celery.resources (unset by default)
      - equal:
          path: spec.template.spec.resources
          value: null
      - equal:
          path: spec.template.spec.containers[?(@.name == "coog-celery")].resources
          value:
            limits:
              cpu: 300m
              memory: 700Mi
            requests:
              cpu: 150m
              memory: 350Mi
      - equal:
          path: spec.template.spec.containers[?(@.name == "coog-celery-database-maintenance")].resources
          value:
            limits:
              cpu: 300m
              memory: 700Mi
            requests:
              cpu: 150m
              memory: 350Mi

  - it: Test pod-level resources include backCore.celery.resources in the max
    template: celery/deployment.yaml
    set:
      backCore:
        celery:
          resources:
            limits:
              cpu: 2
              memory: 512Mi
            requests:
              cpu: 1
              memory: 256Mi
    asserts:
      # max of backCore.celery.resources and the worker/database-maintenance defaults (300m/700Mi, 150m/350Mi)
      - equal:
          path: spec.template.spec.resources
          value:
            limits:
              cpu: 2000m
              memory: 700Mi
            requests:
              cpu: 1000m
              memory: 350Mi
