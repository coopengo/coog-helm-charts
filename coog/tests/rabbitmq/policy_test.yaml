# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Test RabbitMQ queue limit Policy CRD
templates:
  - rabbitmq/policy.yaml
release:
  name: test
  namespace: test
capabilities:
  majorVersion: 1
  minorVersion: 29
tests:
  - it: Renders nothing in legacy mode (default)
    asserts:
      - hasDocuments:
          count: 0

  - it: Caps every queue of the vhost in operator mode (default), refusing new messages beyond
    set:
      rabbitmq:
        mode: operator
        isManaged: false
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Policy
      - equal:
          path: apiVersion
          value: rabbitmq.com/v1beta1
      - equal:
          path: metadata.name
          value: test-coog-rabbitmq-queue-limit
      - equal:
          path: metadata.namespace
          value: test
      - equal:
          path: spec.vhost
          value: /test
      - equal:
          path: spec.pattern
          value: ".*"
      - equal:
          path: spec.applyTo
          value: queues
      - equal:
          path: spec.definition
          value:
            max-length: 100000
            overflow: reject-publish
      - equal:
          path: spec.rabbitmqClusterReference.name
          value: rabbitmq-production
      - equal:
          path: spec.rabbitmqClusterReference.namespace
          value: rabbitmq-system

  - it: Custom limit, vhost and cluster reference are honored
    set:
      rabbitmq:
        mode: operator
        isManaged: false
        operator:
          vhost: /custom-vhost
          cluster:
            name: rabbitmq-staging
            namespace: rabbitmq-staging-ns
          queueLimit:
            maxLength: 250000
    asserts:
      - equal:
          path: spec.vhost
          value: /custom-vhost
      - equal:
          path: spec.definition.max-length
          value: 250000
      - equal:
          path: spec.rabbitmqClusterReference.name
          value: rabbitmq-staging

  - it: Renders nothing when the limit is disabled
    set:
      rabbitmq:
        mode: operator
        isManaged: false
        operator:
          queueLimit:
            enabled: false
    asserts:
      - hasDocuments:
          count: 0
