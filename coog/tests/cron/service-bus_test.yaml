# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Test bus service
templates:
  - cron/service-bus.yaml
release:
  name: test # Do not edit
  namespace: test
capabilities:
  majorVersion: 1
  minorVersion: 29
tests:
  - it: Test bus service absent by default
    asserts:
      - hasDocuments:
          count: 0

  - it: Test bus service targets the bus container of the cron pods
    set:
      backCore:
        bus:
          enabled: true
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: test-coog-bus
      - equal:
          path: spec.type
          value: ClusterIP
      - contains:
          path: spec.ports
          content:
            name: http
            port: 80
            targetPort: bus
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: coog-cron
            app.kubernetes.io/instance: test
